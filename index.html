<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Home</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <!-- MENÚ -->
    <header>
        <a href="#" class="logo">NETFLIX</a>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Series</a>
            <a href="#">Películas</a>
            <a href="#">Mi Lista</a>
        </nav>
    </header>

    <!-- BANNER DESTACADO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Stranger Things</h1>
            <p>Un niño desaparece en un pequeño pueblo, destapando un misterio lleno de experimentos secretos y fuerzas sobrenaturales.</p>
            <button class="btn btn-play">► Reproducir</button>
            <button class="btn btn-info">ℹ Más información</button>
        </div>
    </section>

    <!-- FILA DE PELÍCULAS 1 -->
    <section class="row">
        <h2>Tendencias</h2>
        <div class="posters">
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=400');"></div>
        </div>
    </section>

    <!-- FILA DE PELÍCULAS 2 -->
    <section class="row">
        <h2>Populares</h2>
        <div class="posters">
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1568832331089-188d543169f4?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?w=400');"></div>
            <div class="card" style="background-image: url('https://images.unsplash.com/photo-1514539079130-25950c84af65?w=400');"></div>
