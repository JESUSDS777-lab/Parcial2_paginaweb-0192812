<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            z-index: 1000;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 10%, transparent);
            transition: background-color 0.3s;
        }

        .navbar-left, .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: #E50914;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            color: #e5e5e5;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #b3b3b3;
            font-weight: bold;
        }

        .navbar-right i {
            font-size: 18px;
            cursor: pointer;
            color: #fff;
        }

        .profile-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #333;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png');
            background-size: cover;
            cursor: pointer;
        }

        /* --- HERO BANNER --- */
        .hero {
            height: 80vh;
            position: relative;
            background: linear-gradient(to top, #141414, transparent 90%),
                        url('https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 50px;
        }

        .hero-content {
            max-width: 500px;
            z-index: 10;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero-description {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            color: #ddd;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 25px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-play {
            background-color: #fff;
            color: #000;
        }

        .btn-play:hover {
            background-color: rgba(255, 255, 255, 0.75);
        }

        .btn-info {
            background-color: rgba(109, 109, 110, 0.7);
            color: #fff;
        }

        .btn-info:hover {
            background-color: rgba(109, 109, 110, 0.4);
        }

        /* --- CONTENT ROWS --- */
        .row-container {
            padding: 20px 50px;
            margin-top: -100px;
            position: relative;
            z-index: 20;
        }

        .row-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e5e5e5;
        }

        .row-posters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 20px;
            scrollbar-width: none; /* Firefox */
        }

        .row-posters::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .poster {
            min-width: 200px;
            height: 115px;
            border-radius: 4px;
            background-color: #222;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .poster:hover {
            transform: scale(1.08);
            z-index: 50;
        }

        /* Responsive */
        @media(max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .nav-links {
                display: none;
            }
            .hero {
                padding: 0 20px;
            }
            .hero-title {
                font-size: 2rem;
            }
            .row-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header>
        <div class="navbar-left">
            <a href="#" class="logo">NETFLIX</a>
            <ul class="nav-links">
                <li><a href="#" class="active">Inicio</a></li>
                <li><a href="#">Series</a></li>
                <li><a href="#">Películas</a></li>
                <li><a href="#">Novedades populares</a></li>
                <li><a href="#">Mi lista</a></li>
            </ul>
        </div>
        <div class="navbar-right">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-bell"></i>
            <div class="profile-icon"></div>
        </div>
    </header>

    <!-- BANNER PRINCIPAL (HERO) -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">Stranger Things</h1>
            <p class="hero-description">Cuando un niño desaparece, un pequeño pueblo descubre un misterio que involucra experimentos secretos, fuerzas sobrenaturales aterradoras y una niña extraña.</p>
            <div class="hero-buttons">
                <button class="btn btn-play"><i class="fa-solid fa-play"></i> Reproducir</button>
                <button class="btn btn-info"><i class="fa-solid fa-circle-info"></i> Más información</button>
            </div>
        </div>
    </section>

    <!-- FILAS DE CONTENIDO -->
    <div class="row-container">
        <h2 class="row-title">Tendencias actuales</h2>
        <div class="row-posters">
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=400&auto=format&fit=crop');"></div>
        </div>

        <h2 class="row-title" style="margin-top: 20px;">Populares en Netflix</h2>
        <div class="row-posters">
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1568832331089-188d543169f4?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400&auto=format&fit=crop');"></div>
            <div class="poster" style="background-image: url('https://images.unsplash.com/photo-1514539079130-25950c84af65?q=80&w=400&auto=format&fit=crop');"></div>
        </div>
    </div>

</body>
</html>
